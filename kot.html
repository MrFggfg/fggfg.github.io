<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Odczyt pliku txt</title>
</head>
<body>

    <h1>Zawartość pliku:</h1>
    <pre id="widok">Ładowanie...</pre>

    <script>
        function myDisplayer(someText) {
            document.getElementById("widok").textContent = someText;
        }

        fetch('tekst.txt')
            .then(function(response) {
                return response.text();
            })
            .then(function(data) {
                myDisplayer(data);
            });
    </script>

</body>
</html>
