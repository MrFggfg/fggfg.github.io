<!DOCTYPE html>
<html lang="pl">
<body>
    <div id="out"></div>

    <script>
        window.addEventListener("devicemotion", e => {
            const acc = e.accelerationIncludingGravity;
            document.querySelector("#out").innerText = 
            `X: ${acc.x?.toFixed(1)} | Y: ${acc.y?.toFixed(1)} | Z: ${acc.z?.toFixed(1)}`;    </script>
</body>
</html>
